<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京东轮播效果</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #f5f5f5; padding: 30px; }

  /* ========== 轮播容器 ========== */
  .carousel {
    position: relative;
    width: 790px;
    height: 340px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.15);
  }

  /* 轮播轨道：使用 transform 平移 */
  .slides {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform .5s ease-in-out;
  }

  .slide {
    flex: 0 0 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  /* 用渐变模拟图片 */
  .slide.s1 { background: linear-gradient(135deg, #e53935, #ff8a80); }
  .slide.s2 { background: linear-gradient(135deg, #1e88e5, #64b5f6); }
  .slide.s3 { background: linear-gradient(135deg, #43a047, #81c784); }
  .slide.s4 { background: linear-gradient(135deg, #fb8c00, #ffcc80); }
  .slide.s5 { background: linear-gradient(135deg, #8e24aa, #ce93d8); }

  /* ========== 左右箭头 ========== */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 60px;
    background: rgba(0,0,0,.25);
    color: #fff;
    font-size: 28px;
    line-height: 60px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: background .2s;
  }
  .arrow:hover { background: rgba(0,0,0,.55); }
  .arrow.left  { left: 0; border-radius: 0 6px 6px 0; }
  .arrow.right { right: 0; border-radius: 6px 0 0 6px; }

  /* ========== 小圆点 ========== */
  .dots {
    position: absolute;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
  }
  .dots span {
    width: 12px; height: 12px;
    background: rgba(255,255,255,.5);
    border-radius: 50%;
    cursor: pointer;
    transition: .2s;
  }
  .dots span.active {
    background: #fff;
    transform: scale(1.25);
  }
</style>
</head>
<body>

<div class="carousel" id="carousel">
  <div class="slides" id="slides">
    <div class="slide s1">京东 · 家电狂欢节</div>
    <div class="slide s2">数码新品首发</div>
    <div class="slide s3">生鲜满199减100</div>
    <div class="slide s4">超市抢购 · 限时秒杀</div>
    <div class="slide s5">服饰 · 新品 5 折起</div>
  </div>

  <div class="arrow left"  onclick="prevSlide()">‹</div>
  <div class="arrow right" onclick="nextSlide()">›</div>

  <div class="dots" id="dots">
    <span class="active" onclick="goTo(0)"></span>
    <span onclick="goTo(1)"></span>
    <span onclick="goTo(2)"></span>
    <span onclick="goTo(3)"></span>
    <span onclick="goTo(4)"></span>
  </div>
</div>

<script>
  const slidesEl = document.getElementById('slides');
  const dotsEl   = document.getElementById('dots').children;
  const total    = 5;
  let current    = 0;
  let timer      = null;

  /* 核心：滑动到 index */
  function goTo(index) {
    current = (index + total) % total;
    slidesEl.style.transform = `translateX(-${current * 100}%)`;
    // 更新圆点
    for (let i = 0; i < dotsEl.length; i++) {
      dotsEl[i].classList.toggle('active', i === current);
    }
  }

  function nextSlide() { goTo(current + 1); }
  function prevSlide() { goTo(current - 1); }

  /* 自动播放 */
  function startAuto() {
    timer = setInterval(nextSlide, 2500);
  }
  function stopAuto() {
    clearInterval(timer);
  }

  /* 鼠标移入暂停，移出继续 */
  const carousel = document.getElementById('carousel');
  carousel.addEventListener('mouseenter', stopAuto);
  carousel.addEventListener('mouseleave', startAuto);

  startAuto();
</script>

</body>
</html>
