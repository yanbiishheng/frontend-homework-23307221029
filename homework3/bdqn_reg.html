<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北大青鸟 · 用户注册</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  /* ========== 整页 flex 左右布局 ========== */
  .page {
    display: flex;
    height: 100vh;
  }

  /* ========== 左侧：品牌大图（背景图）========== */
  .left-banner {
    flex: 1.2;
    /* 把官网左侧大图放这里： */
    background: linear-gradient(135deg, #0d47a1, #1976d2);
    /* 图片上传后可取消本行注释并删除上一行渐变：background: url("images/reg-bg.jpg") no-repeat center/cover; */
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    text-align: center;
  }
  .left-banner h1 {
    font-size: 42px;
    margin: 0 0 20px;
    letter-spacing: 4px;
  }
  .left-banner p {
    font-size: 18px;
    opacity: .9;
    line-height: 1.8;
    margin: 0;
  }
  .left-banner .slogan {
    margin-top: 30px;
    font-size: 16px;
    padding: 12px 26px;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 30px;
  }

  /* ========== 右侧：注册表单 ========== */
  .right-form {
    flex: 1;
    background: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 70px;
    overflow-y: auto;
  }
  .right-form h2 {
    font-size: 26px;
    color: #1a237e;
    margin: 0 0 8px;
  }
  .right-form .sub {
    color: #999;
    font-size: 13px;
    margin-bottom: 28px;
  }

  .form-item {
    margin-bottom: 18px;
  }
  .form-item label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
  }
  .form-item .required {
    color: #e53935;
    margin-right: 3px;
  }
  .form-item input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    font-size: 14px;
    transition: .2s;
  }
  /* 图片备用路径：background: url("images/login-input2.png") no-repeat center/cover; */
  /* 图片备用路径：background: url("images/login-input3.png") no-repeat center/cover; */
  /* 图片备用路径：background: url("images/login-input4.png") no-repeat center/cover; */
  /* 图片备用路径：background: url("images/reg-error.png") no-repeat center/cover; */
  .form-item input:focus {
    outline: none;
    border-color: #1976d2;
    box-shadow: 0 0 0 3px rgba(25,118,210,.15);
  }

  /* 验证码行：输入框 + 验证码按钮 */
  .code-row {
    display: flex;
    gap: 10px;
  }
  .code-row input { flex: 1; }
  .code-row button {
    padding: 0 16px;
    background: #e3f2fd;
    color: #1976d2;
    border: 1px solid #90caf9;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: .2s;
  }
  .code-row button:hover {
    background: #1976d2;
    color: #fff;
  }

  /* 协议勾选 */
  .agree {
    font-size: 13px;
    color: #666;
    margin: 20px 0;
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }
  .agree input { margin-top: 3px; }
  .agree a { color: #1976d2; text-decoration: none; }

  /* 提交按钮 */
  .btn-submit {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #1976d2, #0d47a1);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: .25s;
    letter-spacing: 2px;
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(25,118,210,.35);
  }

  .login-link {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #888;
  }
  .login-link a { color: #1976d2; text-decoration: none; }
</style>
</head>
<body>

<div class="page">

  <!-- 左侧品牌区（原网站是背景图，这里用渐变代替） -->
  <div class="left-banner">
    <h1>北大青鸟</h1>
    <p>支持你成为一个受人尊重的专业人才</p>
    <div class="slogan">学 IT · 好工作 · 好未来</div>
  </div>

  <!-- 右侧注册表单 -->
  <div class="right-form">
    <h2>用户注册</h2>
    <p class="sub">已有账号？<a href="#" style="color:#1976d2;text-decoration:none;">立即登录</a></p>

    <form onsubmit="event.preventDefault(); alert('注册演示，未连接后端');">

      <div class="form-item">
        <label><span class="required">*</span>用户名</label>
        <input type="text" placeholder="4-16 位字母、数字或下划线"
               pattern="[A-Za-z0-9_]{4,16}" required>
      </div>

      <div class="form-item">
        <label><span class="required">*</span>手机号码</label>
        <input type="tel" placeholder="请输入 11 位手机号"
               pattern="1[3-9]\d{9}" required>
      </div>

      <div class="form-item">
        <label><span class="required">*</span>短信验证码</label>
        <div class="code-row">
          <input type="text" placeholder="6 位验证码" maxlength="6" pattern="\d{6}" required>
          <button type="button" onclick="sendCode(this)">获取验证码</button>
        </div>
      </div>

      <div class="form-item">
        <label><span class="required">*</span>登录密码</label>
        <input type="password" placeholder="6-20 位，建议字母+数字"
               minlength="6" maxlength="20" required>
      </div>

      <div class="form-item">
        <label><span class="required">*</span>确认密码</label>
        <input type="password" placeholder="请再次输入密码"
               minlength="6" maxlength="20" required>
      </div>

      <label class="agree">
        <input type="checkbox" required>
        <span>我已阅读并同意 <a href="#">《用户服务协议》</a> 和 <a href="#">《隐私政策》</a></span>
      </label>

      <button type="submit" class="btn-submit">立即注册</button>
    </form>

    <div class="login-link">
      已有账号？<a href="#">直接登录</a>
    </div>
  </div>

</div>

<script>
  /* 验证码倒计时演示 */
  function sendCode(btn) {
    let sec = 60;
    btn.disabled = true;
    btn.textContent = sec + 's 后重发';
    const t = setInterval(() => {
      sec--;
      btn.textContent = sec + 's 后重发';
      if (sec <= 0) {
        clearInterval(t);
        btn.disabled = false;
        btn.textContent = '获取验证码';
      }
    }, 1000);
  }
</script>

</body>
</html>
