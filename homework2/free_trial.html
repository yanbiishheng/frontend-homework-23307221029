<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学员免费体验登录</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    font-family: "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;                 /* 整个页面 flex */
    justify-content: center;
    align-items: center;
  }

  .login-card {
    width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 40px 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .login-card h2 {
    margin: 0 0 8px;
    text-align: center;
    color: #333;
  }
  .login-card .sub {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 30px;
  }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 14px;
    color: #555;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    transition: .2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,.15);
  }

  .remember {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #666;
    margin-bottom: 22px;
  }
  .remember a { color: #667eea; text-decoration: none; }

  .btn-login {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: .25s;
  }
  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102,126,234,.4);
  }

  .bottom-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #888;
  }
  .bottom-link a { color: #667eea; text-decoration: none; }
</style>
</head>
<body>

<div class="login-card">
  <h2>🎓 免费体验登录</h2>
  <p class="sub">新用户注册即可获得 7 天免费试学资格</p>

  <form onsubmit="event.preventDefault(); alert('登录演示，未连接后端');">
    <div class="form-group">
      <label>手机号 / 邮箱</label>
      <input type="text" placeholder="请输入手机号或邮箱" required>
    </div>

    <div class="form-group">
      <label>登录密码</label>
      <input type="password" placeholder="请输入密码" required minlength="6">
    </div>

    <div class="remember">
      <label><input type="checkbox"> 记住我</label>
      <a href="#">忘记密码？</a>
    </div>

    <button type="submit" class="btn-login">立即登录</button>
  </form>

  <div class="bottom-link">
    还没有账号？<a href="#">免费注册</a>
  </div>
</div>

</body>
</html>
