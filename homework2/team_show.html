<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队风采</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f4f6fa; padding: 40px 20px; }

  .title {
    text-align: center;
    color: #1a237e;
    margin-bottom: 40px;
  }
  .title h1 { font-size: 32px; margin-bottom: 8px; }
  .title p { color: #888; margin: 0; }

  /* 团队成员网格：flex 自动换行 */
  .team-wrap {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    justify-content: center;
  }

  .member {
    flex: 0 1 240px;               /* 不放大，可缩小，基础 240px */
    background: #fff;
    border-radius: 14px;
    text-align: center;
    padding: 30px 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
    transition: transform .3s, box-shadow .3s;
  }
  .member:hover {
    transform: translateY(-8px);
    box-shadow: 0 14px 32px rgba(0,0,0,.15);
  }

  .avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    margin: 0 auto 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    color: #fff;
    font-weight: bold;
  }
  .avatar.c1 { background: linear-gradient(135deg,#ff6b6b,#ee5a6f); }
  .avatar.c2 { background: linear-gradient(135deg,#4facfe,#00f2fe); }
  .avatar.c3 { background: linear-gradient(135deg,#43e97b,#38f9d7); }
  .avatar.c4 { background: linear-gradient(135deg,#fa709a,#fee140); }
  .avatar.c5 { background: linear-gradient(135deg,#a18cd1,#fbc2eb); }
  .avatar.c6 { background: linear-gradient(135deg,#f093fb,#f5576c); }

  .member h3 { margin: 0 0 6px; color: #222; font-size: 18px; }
  .member .role { color: #667eea; font-size: 14px; margin-bottom: 12px; }
  .member .desc { color: #777; font-size: 13px; line-height: 1.6; }

  /* 每个成员下面加社交图标 (flex 居中) */
  .socials {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
  }
  .socials a {
    display: inline-flex;
    width: 28px; height: 28px;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background: #eef1f8;
    color: #667eea;
    text-decoration: none;
    font-size: 14px;
    transition: .2s;
  }
  .socials a:hover { background: #667eea; color: #fff; }
</style>
</head>
<body>

<div class="title">
  <h1>👥 团队风采</h1>
  <p>一群热爱技术、乐于分享的伙伴</p>
</div>

<div class="team-wrap">

  <div class="member">
    <div class="avatar c1">张</div>
    <h3>张明</h3>
    <div class="role">教学总监</div>
    <div class="desc">10 年 Java 教学经验，主导课程体系建设。</div>
    <div class="socials"><a href="#">✉</a><a href="#">☎</a></div>
  </div>

  <div class="member">
    <div class="avatar c2">李</div>
    <h3>李雪</h3>
    <div class="role">前端讲师</div>
    <div class="desc">专注 Vue / React，擅长项目实战教学。</div>
    <div class="socials"><a href="#">✉</a><a href="#">☎</a></div>
  </div>

  <div class="member">
    <div class="avatar c3">王</div>
    <h3>王强</h3>
    <div class="role">后端讲师</div>
    <div class="desc">前阿里工程师，精通微服务与高并发。</div>
    <div class="socials"><a href="#">✉</a><a href="#">☎</a></div>
  </div>

  <div class="member">
    <div class="avatar c4">赵</div>
    <h3>赵敏</h3>
    <div class="role">UI 设计师</div>
    <div class="desc">8 年设计经验，负责学员作品集指导。</div>
    <div class="socials"><a href="#">✉</a><a href="#">☎</a></div>
  </div>

  <div class="member">
    <div class="avatar c5">刘</div>
    <h3>刘洋</h3>
    <div class="role">就业指导</div>
    <div class="desc">对接 500+ 企业，累计输送学员 3000+。</div>
    <div class="socials"><a href="#">✉</a><a href="#">☎</a></div>
  </div>

  <div class="member">
    <div class="avatar c6">陈</div>
    <h3>陈静</h3>
    <div class="role">班主任</div>
    <div class="desc">关注每位学员的学习与心理状态。</div>
    <div class="socials"><a href="#">✉</a><a href="#">☎</a></div>
  </div>

</div>

</body>
</html>
